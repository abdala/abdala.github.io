<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<title>Dutch Irregular Verbs – Flashcards</title>
<style>
  :root {
    --bg: #f3f4f6; --card: #ffffff; --text: #111827; --muted: #6b7280;
    --accent: #f97316; --good: #16a34a; --bad: #dc2626; --border: #e5e7eb;
    --shadow: 0 10px 30px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111827; --card: #1f2937; --text: #f9fafb; --muted: #9ca3af; --border: #374151; --shadow: 0 10px 30px rgba(0,0,0,.5); }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; align-items: center; min-height: 100vh; min-height: 100dvh;
    padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
  }
  header, main, footer, .top { width: 100%; max-width: 560px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 0 6px; gap: 8px; }
  h1 { font-size: 1.05rem; margin: 0; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .icon-btn { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; }

  .stats { font-size: .85rem; color: var(--muted); display: flex; justify-content: space-between; margin: 4px 2px 6px; }
  .bar { height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; display: flex; }
  .bar span { display: block; height: 100%; background: var(--good); transition: width .3s; }
  .bar span.learning { background: var(--accent); }

  main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 12px 0; }
  .scene { perspective: 1200px; width: 100%; height: min(62vh, 460px); min-height: 300px; }
  .card { position: relative; width: 100%; height: 100%; transition: transform .45s; transform-style: preserve-3d; cursor: pointer; }
  .card.flipped { transform: rotateY(180deg); }
  .card.noanim { transition: none; }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--card); border-radius: 22px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 36px 20px 28px; text-align: center; overflow: auto;
  }
  .face.back { transform: rotateY(180deg); }
  .tag { position: absolute; top: 14px; left: 16px; font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .star { position: absolute; top: 12px; right: 16px; color: var(--accent); font-size: 1.1rem; }
  .big { font-size: clamp(1.8rem, 8vw, 2.8rem); font-weight: 700; word-break: break-word; }
  .eng-line { color: var(--accent); margin-top: 6px; }
  .sub { color: var(--muted); margin-top: 10px; font-size: 1.05rem; }
  .hint { position: absolute; bottom: 10px; font-size: .75rem; color: var(--muted); }
  .forms { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; text-align: left; font-size: clamp(1rem, 4.5vw, 1.3rem); margin: 0; }
  .forms dt { color: var(--muted); font-size: .8rem; align-self: center; text-transform: uppercase; letter-spacing: .05em; }
  .forms dd { margin: 0; font-weight: 600; }
  .forms .eng { font-weight: 400; color: var(--accent); }
  .ex { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); width: 100%; }
  .ex .nl { font-size: clamp(1rem, 4.5vw, 1.2rem); font-style: italic; }
  .ex .en { font-size: .9rem; color: var(--muted); margin-top: 4px; }
  .ex mark { background: none; color: var(--accent); font-weight: 700; }
  .say { background: var(--bg); border: 1px solid var(--border); border-radius: 99px; padding: 6px 14px; font-size: .9rem; margin-top: 14px; }
  .say:active { background: var(--border); }
  .say-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .no-tts .say { display: none; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .actions button { border: 0; border-radius: 14px; padding: 16px; font-size: 1.05rem; font-weight: 600; color: #fff; }
  .actions .no { background: var(--bad); }
  .actions .yes { background: var(--good); }
  .actions button:disabled { opacity: .35; cursor: default; }
  .empty { text-align: center; padding: 30px 10px; }

  footer { padding: 6px 0 12px; font-size: .75rem; color: var(--muted); text-align: center; }

  dialog { border: 0; border-radius: 18px; padding: 20px; background: var(--card); color: var(--text); width: min(92vw, 420px); box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog h2 { margin: 0 0 12px; font-size: 1.1rem; }
  label.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  select { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }
  .dlg-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: space-between; }
  .dlg-actions button { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); }
  .dlg-actions .danger { color: var(--bad); }
  .dlg-actions .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
</style>
</head>
<body>

<header>
  <h1>🇳🇱 Onregelmatige werkwoorden</h1>
  <button class="icon-btn" id="openSettings" aria-label="Settings">⚙︎ Settings</button>
</header>

<div class="top">
  <div class="stats"><span id="statLeft"></span><span id="statRight"></span></div>
  <div class="bar" aria-hidden="true"><span id="barMastered"></span><span class="learning" id="barLearning"></span></div>
</div>

<main>
  <div id="study">
    <div class="scene">
      <div class="card" id="card" tabindex="0" role="button" aria-label="Flip card">
        <div class="face front" id="front"></div>
        <div class="face back" id="back"></div>
      </div>
    </div>
    <div class="actions">
      <button class="no" id="btnNo" disabled>✗ Again</button>
      <button class="yes" id="btnYes" disabled>✓ Got it</button>
    </div>
  </div>
  <div class="empty" id="empty" hidden>
    <h2>🎉 All done!</h2>
    <p>Nothing left to study with the current filters.</p>
  </div>
</main>

<footer>Tap card or press Space to flip · ← again · → got it</footer>

<dialog id="settings">
  <h2>Settings</h2>
  <label class="row">Mode
    <select id="optMode">
      <option value="nl-en">Dutch → English</option>
      <option value="en-nl">English → Dutch</option>
      <option value="forms">Infinitive → past forms</option>
    </select>
  </label>
  <label class="row">Show example sentence <input type="checkbox" id="optSentence"></label>
  <label class="row">Voice
    <select id="optVoice" style="max-width:60%"><option value="auto">Auto (best available)</option></select>
  </label>
  <label class="row">Only frequent verbs <input type="checkbox" id="optFreq"></label>
  <label class="row">Shuffle new cards <input type="checkbox" id="optShuffle"></label>
  <label class="row">Hide mastered cards <input type="checkbox" id="optHideMastered"></label>
  <div class="dlg-actions">
    <button class="danger" id="btnReset">Reset progress</button>
    <button class="primary" id="btnClose">Done</button>
  </div>
</dialog>

<script>
/* ---------- Data: infinitive | imperfect | perfect | English | frequent(1) | Dutch sentence | English sentence ----------
   Sentences are written for study purposes; the verb form used in the sentence is wrapped in [brackets] to be highlighted. */

schieten|schoot, schoten|geschoten|shoot||De speler [schoot] de bal in het doel.|The player shot the ball into the goal.
schijnen|scheen, schenen|geschenen|shine, seem|1|De zon [schijnt] vandaag.|The sun is shining today.
schrijven|schreef, schreven|geschreven|write|1|Ik [schrijf] een e-mail aan mijn baas.|I am writing an email to my boss.
schrikken|schrok, schrokken|is geschrokken|be shocked||Ik [schrok] van het harde geluid.|I was startled by the loud noise.
schuiven|schoof, schoven|geschoven|push, shove||Hij [schoof] de tafel naar de muur.|He pushed the table to the wall.
slaan|sloeg, sloegen|geslagen|hit||Hij [sloeg] de bal met zijn hand.|He hit the ball with his hand.
slapen|sliep, sliepen|geslapen|sleep|1|De baby [slaapt] al.|The baby is already asleep.
sluiten|sloot, sloten|gesloten|close|1|De winkel [sluit] om zes uur.|The shop closes at six o'clock.
snijden|sneed, sneden|gesneden|cut|1|Ik [sneed] het brood met een mes.|I cut the bread with a knife.

staan|stond, stonden|gestaan|stand|1|De fiets [staat] in de schuur.|The bike is in the shed.
steken|stak, staken|gestoken|stab, sting||Een wesp [stak] me in mijn arm.|A wasp stung me on the arm.
stelen|stal, stalen|gestolen|steal|1|Iemand [stal] mijn fiets.|Someone stole my bike.
sterven|stierf, stierven|is gestorven|die||Zijn opa [stierf] vorig jaar.|His grandfather died last year.

vliegen|vloog, vlogen|gevlogen|fly||De vogel [vloog] over de rivier.|The bird flew over the river.

vragen|vroeg, vroegen|gevraagd|ask|1|Mag ik je iets [vragen]?|May I ask you something?
vriezen|vroor, vroren|gevroren|freeze||Het [vroor] vannacht.|It froze last night.

wegen|woog, wogen|gewogen|weigh||De koffer [woog] twintig kilo.|The suitcase weighed twenty kilos.
werpen|wierp, wierpen|geworpen|throw||Hij [wierp] de bal naar zijn broer.|He threw the ball to his brother.
weten|wist, wisten|geweten|know|1|Ik [weet] het antwoord niet.|I don't know the answer.
wijzen|wees, wezen|gewezen|show, point||Ze [wees] naar de overkant.|She pointed to the other side.

const CARDS = RAW.trim().split("\n").map((l, i) => {
  const [inf, imp, perf, eng, f, nl, en] = l.split("|");
  return { id: inf, i, inf, imp, perf, eng, freq: f === "1", nl, en };
});

/* ---------- State (localStorage) ---------- */
const KEY = "dutch-verbs-flashcards-v1";
const INTERVALS = [0, 3, 8, 20, 50];   // cards until next review, by box
const MASTERED = INTERVALS.length;     // box >= this means mastered
const defaults = { settings: { mode: "nl-en", sentence: true, voice: "auto", freq: false, shuffle: true, hideMastered: false },
                   progress: {}, counter: 0 };
let state;
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch { state = {}; }
state = { ...defaults, ...state, settings: { ...defaults.settings, ...(state.settings || {}) },
          progress: state.progress || {} };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };
const prog = id => state.progress[id] || (state.progress[id] = { box: 0, due: 0, seen: 0, rnd: Math.random() });

/* ---------- Queue ---------- */
let current = null, lastId = null;

function pool() {
  const s = state.settings;
  return CARDS.filter(c => (!s.freq || c.freq) && !(s.hideMastered && prog(c.id).box >= MASTERED));
}

function pickNext() {
  const p = pool();
  if (!p.length) return null;
  const n = state.counter;
  const cands = p.filter(c => c.id !== lastId || p.length === 1);
  const due = cands.filter(c => prog(c.id).due <= n);
  const list = due.length ? due : cands;
  const order = c => state.settings.shuffle ? prog(c.id).rnd : c.i;
  const key = c => {
    const pr = prog(c.id);
    // due cards: lowest box first, unseen before seen; otherwise soonest due
    return due.length ? [pr.box, pr.seen > 0 ? 1 : 0, order(c)] : [pr.due, 0, order(c)];
  };
  list.sort((a, b) => {
    const ka = key(a), kb = key(b);
    for (let i = 0; i < 3; i++) if (ka[i] !== kb[i]) return ka[i] - kb[i];
    return 0;
  });
  return list[0];
}

function answer(known) {
  if (!current || !flipped) return;
  const pr = prog(current.id);
  state.counter++;
  pr.seen++;
  pr.box = known ? Math.min(pr.box + 1, MASTERED) : 0;
  pr.due = state.counter + (known ? INTERVALS[Math.min(pr.box, MASTERED - 1)] : 2);
  pr.rnd = Math.random();
  lastId = current.id;
  save();
  next();
}

/* ---------- Rendering ---------- */
const $ = id => document.getElementById(id);
const cardEl = $("card");
let flipped = false;

const esc = s => s.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

function formsHTML(c) {
  return `<dl class="forms">
    <dt>Infinitive</dt><dd>${esc(c.inf)}</dd>
    <dt>Imperfect</dt><dd>${esc(c.imp)}</dd>
    <dt>Perfect</dt><dd>${esc(c.perf)}</dd>
  </dl>`;
}

function sentenceHTML(c) {
  if (!state.settings.sentence || !c.nl) return "";
  const nl = esc(c.nl).replace(/\[(.+?)\]/g, "<mark>$1</mark>");
  return `<div class="ex"><div class="nl">${nl}</div><div class="en">${esc(c.en)}</div></div>`;
}

/* ---------- Text-to-speech (browser Web Speech API) ---------- */
const TTS = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
if (!TTS) document.body.classList.add("no-tts");

/* Ranking based on the Readium "recommended voices" list for Dutch
   (github.com/readium/speech, json/nl.json): neural/natural voices first,
   then Google, then Apple, then basic system voices. nl-NL is preferred over nl-BE. */
function voiceScore(v) {
  const n = v.name, l = v.lang.replace("_", "-");
  if (!/^nl(-|$)/i.test(l)) return -1;
  let sc = 0;
  if (/Colette.*Natural/i.test(n)) sc = 100;
  else if (/Fenna.*Natural/i.test(n)) sc = 98;
  else if (/Maarten.*Natural/i.test(n)) sc = 96;
  else if (/Hanna.*Online/i.test(n)) sc = 90;
  else if (/Online \(Natural\)/i.test(n)) sc = 85;              // e.g. Belgian neural voices
  else if (/Google Nederlands \d|nl-nl-x-/i.test(n)) sc = 80;   // Android / ChromeOS "Natural"
  else if (/Premium/i.test(n)) sc = 75;                         // Apple premium
  else if (/Enhanced|Verbeterd/i.test(n)) sc = 70;              // Apple enhanced
  else if (/Google/i.test(n)) sc = 60;                          // Chrome desktop "Google Nederlands"
  else if (/Xander|Claire/i.test(n)) sc = 50;                   // Apple standard
  else if (/Frank/i.test(n)) sc = 40;                           // Windows basic
  else sc = 20;
  if (/^nl-NL$/i.test(l)) sc += 5;
  if (v.localService) sc += 1;                                  // tie-break: works offline
  return sc;
}
function dutchVoices() {
  return speechSynthesis.getVoices().map(v => [v, voiceScore(v)]).filter(x => x[1] >= 0)
    .sort((a, b) => b[1] - a[1]).map(x => x[0]);
}
function dutchVoice() {
  const list = dutchVoices(), pick = state.settings.voice;
  return (pick && pick !== "auto" && list.find(v => v.voiceURI === pick)) || list[0] || null;
}
function populateVoices() {
  if (!TTS) return;
  const sel = $("optVoice"), list = dutchVoices();
  sel.innerHTML = `<option value="auto">Auto (best available)</option>` +
    list.map(v => `<option value="${esc(v.voiceURI)}">${esc(v.name)}${v.localService ? "" : " ☁"}</option>`).join("");
  sel.value = list.some(v => v.voiceURI === state.settings.voice) ? state.settings.voice : "auto";
}
function speak(text) {
  if (!TTS || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "nl-NL";
  const v = dutchVoice();
  if (v) { u.voice = v; u.lang = v.lang; }
  u.rate = 0.9;
  speechSynthesis.speak(u);
}
if (TTS) { speechSynthesis.getVoices(); speechSynthesis.addEventListener("voiceschanged", populateVoices); }

const sayBtn = (what, label) => `<button class="say" type="button" data-say="${what}">${label}</button>`;
function sayRow(c) {
  const sent = state.settings.sentence && c.nl;
  return `<div class="say-row">${sayBtn("inf", "🔊 Word")}${sayBtn("forms", "🔊 Forms")}${sent ? sayBtn("nl", "🔊 Sentence") : ""}</div>`;
}
function textFor(what) {
  const c = current;
  if (what === "inf") return c.inf;
  if (what === "forms") return `${c.inf}. ${c.imp.replace(/ \/ /g, ", of ")}. ${c.perf.replace(/[()]|---/g, "")}`;
  if (what === "nl") return c.nl.replace(/[\[\]]/g, "");
  return "";
}

function render() {
  const c = current, mode = state.settings.mode;
  $("study").hidden = !c;
  $("empty").hidden = !!c;
  if (c) {
    const star = c.freq ? `<span class="star" title="Frequent verb">★</span>` : "";
    const ex = sentenceHTML(c);
    const back = `<span class="tag">Answer</span>${star}<div class="big" style="margin-bottom:16px;color:var(--accent)">${esc(c.eng)}</div>${formsHTML(c)}${sayRow(c)}${ex}`;
    let front;
    if (mode === "nl-en") {
      front = `<span class="tag">Dutch</span>${star}<div class="big">${esc(c.inf)}</div>${sayBtn("inf", "🔊 Listen")}`;
    } else if (mode === "en-nl") {
      front = `<span class="tag">English</span>${star}<div class="big">${esc(c.eng)}</div>`;
    } else {
      front = `<span class="tag">Past forms?</span>${star}<div class="big">${esc(c.inf)}</div><div class="sub">${esc(c.eng)}</div>${sayBtn("inf", "🔊 Listen")}`;
    }
    $("front").innerHTML = front + `<span class="hint">tap to flip</span>`;
    $("back").innerHTML = back;
  }
  $("btnYes").disabled = $("btnNo").disabled = !c || !flipped;
  cardEl.classList.toggle("flipped", flipped);
  updateStats();
}

function updateStats() {
  const p = pool(), total = p.length || 1;
  const mastered = p.filter(c => prog(c.id).box >= MASTERED).length;
  const learning = p.filter(c => { const b = prog(c.id).box; return b > 0 && b < MASTERED; }).length;
  const seen = p.filter(c => prog(c.id).seen > 0).length;
  $("statLeft").textContent = `${mastered} mastered · ${learning} learning`;
  $("statRight").textContent = `${seen}/${p.length} seen · ${state.counter} reviews`;
  $("barMastered").style.width = (mastered / total * 100) + "%";
  $("barLearning").style.width = (learning / total * 100) + "%";
}

function next() {
  // Switch to the next card without a flip-back animation that would reveal the answer
  flipped = false;
  cardEl.classList.add("noanim");
  current = pickNext();
  render();
  void cardEl.offsetWidth;
  cardEl.classList.remove("noanim");
}

function flip() {
  if (!current) return;
  flipped = !flipped;
  render();
}

/* ---------- Events ---------- */
cardEl.addEventListener("click", e => {
  const b = e.target.closest("[data-say]");
  if (b) { speak(textFor(b.dataset.say)); return; }
  flip();
});
$("btnYes").addEventListener("click", () => answer(true));
$("btnNo").addEventListener("click", () => answer(false));

document.addEventListener("keydown", e => {
  if ($("settings").open) return;
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
  else if (e.key === "ArrowRight") answer(true);
  else if (e.key === "ArrowLeft") answer(false);
});

// Swipe left/right on a flipped card
let sx = null, swiped = false;
cardEl.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
cardEl.addEventListener("touchend", e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 80) { swiped = true; answer(dx > 0); }
});
cardEl.addEventListener("click", e => { if (swiped) { swiped = false; e.stopImmediatePropagation(); } }, true);

/* Settings */
const dlg = $("settings");
const opts = { mode: "optMode", sentence: "optSentence", voice: "optVoice", freq: "optFreq", shuffle: "optShuffle", hideMastered: "optHideMastered" };
function loadSettingsUI() {
  for (const [k, id] of Object.entries(opts)) {
    const el = $(id); if (typeof state.settings[k] === "boolean") el.checked = state.settings[k];
    else { el.value = state.settings[k]; if (el.value !== state.settings[k]) el.value = "auto"; }
  }
}
function applySettings() {
  for (const [k, id] of Object.entries(opts)) {
    const el = $(id); state.settings[k] = typeof defaults.settings[k] === "boolean" ? el.checked : el.value;
  }
  save();
  flipped = false; lastId = null;
  current = pickNext(); render();
}
Object.values(opts).forEach(id => $(id).addEventListener("change", applySettings));
$("openSettings").addEventListener("click", () => { populateVoices(); loadSettingsUI(); dlg.showModal(); });
$("btnClose").addEventListener("click", () => dlg.close());
$("btnReset").addEventListener("click", () => {
  if (confirm("Reset all progress?")) {
    state.progress = {}; state.counter = 0; save();
    lastId = null; flipped = false; current = pickNext(); render();
  }
});

/* ---------- Init ---------- */
loadSettingsUI();
current = pickNext();
render();
</script>
</body>
</html>
